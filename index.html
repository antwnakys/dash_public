<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="unidash" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved theme before first paint so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('unidash.theme.v1'))
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
      // The design (Settings → Appearance), per device: Classic unless Obsidian was chosen.
      try {
        if (JSON.parse(localStorage.getItem('unidash.look.v1')) === 'obsidian') document.documentElement.dataset.look = 'obsidian'
      } catch (e) {}
    </script>
    <title>unidash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
