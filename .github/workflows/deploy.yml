name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The iPhone app updates itself from these two files (src/lib/liveUpdate.ts).
      - name: Publish the app bundle for live updates
        run: |
          (cd dist && zip -qr ../app-bundle.zip .)
          mv app-bundle.zip dist/
          checksum=$(sha256sum dist/app-bundle.zip | cut -d' ' -f1)
          printf '{"version":"%s","url":"app-bundle.zip","checksum":"%s"}\n' "${GITHUB_SHA::7}" "$checksum" > dist/version.json
          cat dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
