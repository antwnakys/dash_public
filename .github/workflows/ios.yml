name: iPhone build check

# Compiles the Xcode project on a GitHub-hosted Mac without signing, so a broken iPhone build shows up
# on the pull request. Uploading to TestFlight is testflight.yml (or scripts/testflight.sh on a Mac).
on:
  pull_request:
    paths:
      - ios/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - .github/workflows/ios.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build (unsigned)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unidash.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
