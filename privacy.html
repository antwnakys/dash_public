<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="unidash privacy policy: your data stays on your device and in your own Google Drive. No server, no ads, no tracking." />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('unidash.theme.v1'))
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>unidash · Privacy policy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacy/main.tsx"></script>
  </body>
</html>
